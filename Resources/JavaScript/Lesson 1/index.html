<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lekcja 1 - Instrukcje warunkowe</title>
</head>
<body>
    <script>
        const number = 12;

        if (number % 2 === 0) {
            console.log(`${number} jest parzysta.`);
        } else {
            console.log(`${number} jest nieparzysta.`);
        }

        if (number > 0) {
            console.log("Liczba dodatnia");
        } else if (number < 0) {
            console.log("Liczba ujemna");
        } else {
            console.log("Zero");
        }

        const day = 3;
        switch (day) {
            case 1:
                console.log("Poniedziałek");
                break;
            case 2:
                console.log("Wtorek");
                break;
            case 3:
                console.log("Środa");
                break;
            default:
                console.log("Inny dzień");
        }
    </script>
</body>
</html>
